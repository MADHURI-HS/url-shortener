# MySQL (local)
# The database is created automatically if it does not exist.
spring.datasource.url=jdbc:mysql://localhost:3306/urlshortener?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${LOCAL_DB_USERNAME:root}
spring.datasource.password=${LOCAL_DB_PASSWORD:root}

# JPA
spring.jpa.show-sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Application
app.base-url=http://localhost:8080

# Local-development-only JWT secret so the app starts without any environment variables.
# NEVER use this value in production (the prod profile requires JWT_SECRET).
jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789-abcdef}
