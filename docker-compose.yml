services:

  mysql:
    image: mysql:8.4
    container_name: url-shortener-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: urlshortener
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: url-shortener-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  app:
    build: .
    container_name: url-shortener-app
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/urlshortener?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      REDIS_HOST: redis
      REDIS_PORT: 6379

      APP_BASE_URL: http://localhost:8080

      # development-only value
      JWT_SECRET: docker-dev-only-secret-change-me-0123456789-abcdef

volumes:
  mysql_data:
  redis_data:
